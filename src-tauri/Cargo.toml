[package]
name = "catty"
version = "0.1.0"
description = "A minimal fast terminal emulator"
authors = ["you"]
edition = "2021"

[lib]
name = "catty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alacritty_terminal = "0.26"
parking_lot = "0.12"
polling = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation"] }
log = "0.4"
dirs = "5"

[profile.release]
opt-level = 2
